faq:
  - question: What is Spanlens?
  - question: Does Spanlens send my trace data to the cloud?
    answer: No. Spanlens reads traces from local OTLP files or a local collector, and nothing is uploaded.
  - question: How is Spanlens different from a hosted APM?
    answer: A hosted APM stores your traces on its servers for dashboards and alerts. Spanlens is a debugger that keeps traces on your machine and focuses on replaying one request at a time.
  - question: Do I need to change my instrumentation to use Spanlens?
    answer: No. If your services already emit OpenTelemetry data, Spanlens can read it as is.
  - question: What is trace replay?
